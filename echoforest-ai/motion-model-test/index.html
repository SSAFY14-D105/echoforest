<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 EchoForest Heart Lab</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- 왼쪽: 카메라 -->
    <div class="camera-section">
        <div class="camera-wrapper">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls-bar">
            <button class="btn" id="btnInit">1️⃣ 모델 로드</button>
            <button class="btn" id="btnCamera" disabled>2️⃣ 카메라 권한</button>
            <button class="btn" id="btnStart" disabled>3️⃣ 감지 시작</button>
        </div>

        <div class="detection-result">
            <div class="detection-emoji" id="emoji">🤚</div>
            <div class="detection-label" id="label">대기중</div>
            <div class="detection-score" id="score">-</div>
            <div style="margin-top:10px; font-size:12px; color:#888" id="debugInfo"></div>
        </div>
    </div>

    <!-- 오른쪽: 로그 -->
    <div class="panel-section">
        <div class="panel">
            <h3>📝 System Log</h3>
            <div class="log" id="log"></div>
        </div>

        <div class="panel">
            <h3>ℹ️ Guide</h3>
            <p style="font-size:12px; color:#ccc;">
                <b>Heart-Sign (양손 하트)</b><br>
                - 양손을 이용해 하트 모양을 만들어주세요.<br>
                - 양손 엄지 끝과 검지 끝이 서로 맞닿아야 합니다.<br>
                - 왼손이 왼쪽, 오른손이 오른쪽에 위치해야 인식됩니다.
            </p>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
