<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎛️ 제스처 튜닝 대시보드</title>
    <link rel="stylesheet" href="css/gesture-tuner.css">
</head>

<body>
    <!-- 왼쪽: 카메라 -->
    <div id="camera-section" class="camera-section"></div>

    <!-- 오른쪽: 패널들 -->
    <div class="panel-section">
        <!-- 임계값 슬라이더 (Rendered by JS) -->
        <div id="threshold-panel-container"></div>

        <!-- 실시간 수치 (Rendered by JS) -->
        <div id="metrics-panel-container"></div>

        <!-- 손가락 상태 (Rendered by JS) -->
        <div id="finger-status-panel-container"></div>

        <!-- 커스텀 거리 측정 (Rendered by JS) -->
        <div id="distance-panel-container"></div>

        <!-- 양손 간 거리 측정 (Rendered by JS) -->
        <div id="dual-hand-panel-container"></div>

        <!-- 입술 수치 (Rendered by JS) -->
        <div id="lip-status-panel-container"></div>

        <!-- 볼콕 감지 (Rendered by JS) -->
        <div id="cheek-poke-panel-container"></div>

        <!-- 랜드마크 원시 데이터 (Rendered by JS) -->
        <div id="landmark-raw-panel-container"></div>

        <!-- 로그 (Rendered by JS) -->
        <div id="log-panel-container"></div>

        <!-- 엄지(4) 기준 거리 매트릭스 (Rendered by JS) -->
        <div id="matrix-panel-container"></div>

        <!-- 손가락 끝 5x5 매트릭스 (Rendered by JS) -->
        <div id="fingertip-matrix-panel-container"></div>

        <!-- 스냅샷 캡처 (Rendered by JS) -->
        <div id="capture-panel-container"></div>
    </div>

    <!-- 모든 로직은 모듈로 분리됨 -->
    <script type="module" src="./js/GestureTunerApp.js"></script>
</body>

</html>
