events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # HTTP -> HTTPS 리다이렉트
    server {
        listen 80;
        server_name i14d105.p.ssafy.io;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 설정
    server {
        listen 443 ssl;
        server_name i14d105.p.ssafy.io;

        ssl_certificate /etc/letsencrypt/live/i14d105.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/i14d105.p.ssafy.io/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # ----------------------------------------------------
        # Jenkins 설정 (https://도메인/jenkins 접속 시)
        # ----------------------------------------------------
        location /jenkins {
            # docker-compose의 서비스 이름 'jenkins'의 8080포트로 보냄
            # 주의: 뒤에 /jenkins 경로까지 붙여야 함
            proxy_pass http://jenkins:8080/jenkins;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 젠킨스 오류 방지용 헤더 설정
            proxy_max_temp_file_size 0;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ----------------------------------------------------
        # [기존] 게임 서버 설정 (그 외 모든 요청 /)
        # ----------------------------------------------------
        location / {
            proxy_pass http://game-server:9001;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 웹소켓 설정 (LiveKit 등)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}