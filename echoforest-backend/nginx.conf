events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # HTTP -> HTTPS 리다이렉트
    server {
        listen 80;
        server_name i14d105.p.ssafy.io;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 설정
    server {
        listen 443 ssl;
        server_name i14d105.p.ssafy.io;

        ssl_certificate /etc/letsencrypt/live/i14d105.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/i14d105.p.ssafy.io/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # ----------------------------------------------------
        # Jenkins 설정 (https://도메인/jenkins 접속 시)
        # ----------------------------------------------------
        location /jenkins {
            # docker-compose의 서비스 이름 'jenkins'의 8080포트로 보냄
            # 주의: 뒤에 /jenkins 경로까지 붙여야 함
            proxy_pass http://jenkins:8080/jenkins;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 젠킨스 오류 방지용 헤더 설정
            proxy_max_temp_file_size 0;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ----------------------------------------------------
        # 1. LiveKit 시그널링 설정
        # - 클라이언트 접속 주소: wss://i14d105.p.ssafy.io/livekit/
        # ----------------------------------------------------
        location /livekit/ {
            # 내부 도커 네트워크의 livekit:7880으로 전달
            # [주의] 뒤에 /를 붙여야 /livekit 경로가 벗겨지고 LiveKit 루트로 전달됨
            proxy_pass http://livekit:7880/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # ----------------------------------------------------
        # 2. AI 서버 설정 (/ai 경로로 분기)
        # ----------------------------------------------------
        # https://도메인/ai-server/api/v1/analyze -> http://ai-server:8000/api/v1/analyze 로 연결됨
        location /ai-server/ {
            # docker-compose의 서비스명 'ai-server' 사용
            # [중요] 끝에 /를 붙여야 '/ai/' 부분이 제거되고 뒷부분만 AI 서버로 넘어감
            proxy_pass http://ai-server:8000/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # FastAPI Swagger UI 등이 잘 동작하도록 설정
            proxy_redirect off;
        }

        # ----------------------------------------------------
        # 게임 서버 설정 (그 외 모든 요청 /)
        # ----------------------------------------------------
        location / {
            proxy_pass http://game-server:9001;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 웹소켓 설정 (LiveKit 등)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}