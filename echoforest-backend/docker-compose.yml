version: '3.8'

services:
  # ==========================================
  # 0. 게임 서버 (Spring Boot)
  # ==========================================
  game-server:
    build: .                # 현재 폴더의 Dockerfile로 빌드
    container_name: echoforest-server
    ports:
      - "9001:9001"         # 외부 접속 포트
    environment:
      # 도커 내부에서는 'localhost' 대신 '서비스 이름'을 씁니다.
      - LIVEKIT_URL=wss://i14d105.p.ssafy.io:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - DB_URL=jdbc:mysql://mysql:3306/echoforest?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      - DB_USERNAME=user
      - DB_PASSWORD=password
      - DB_DRIVER=com.mysql.cj.jdbc.Driver
      - DB_PLATFORM=org.hibernate.dialect.MySQL8Dialect
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - livekit
      - mysql
      - redis
    volumes:
      - ./uploads:/app/uploads
    networks:
      - echo-net

  # ==========================================
  # 1. LiveKit Server (기존 작성 내용 유지)
  # ==========================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: echoforest-livekit
    command: --dev
    ports:
      - "7880:7880" # 시그널링 (TCP)
      - "7881:7881" # (선택) HTTP API용, 보통 7880으로 다 됨
      - "60000-60200:60000-60200/udp" # WebRTC 미디어 전송용 포트 범위
      - "3478:3478/udp"  # TURN 서버용 (UDP)
      - "3478:3478/tcp"  # TURN 서버용 (TCP)
    environment:
      - "LIVEKIT_KEYS=devkey: secret"  # 주의: devkey:(공백)secret
    networks:
      - echo-net

  # ==========================================
  # 2. MySQL (기존 작성 내용 유지)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: echoforest-mysql
    restart: always
    environment:
      MYSQL_DATABASE: echoforest
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      TZ: Asia/Seoul
    ports:
      - "3307:3306" # 포트 충돌 방지
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql_data:/var/lib/mysql # 데이터 영구 저장 (프로젝트 폴더에 생김)
    networks:
      - echo-net

  # ==========================================
  # 3. Redis (기존 작성 내용 유지)
  # ==========================================
  redis:
    image: redis:alpine
    container_name: echoforest-redis
    ports:
      - "6379:6379"
    networks:
      - echo-net

  # ==========================================
  # 4. Nginx (웹 서버)
  # ==========================================
  nginx:
    image: nginx:latest
    container_name: echoforest-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - game-server
    networks:
      - echo-net

    # ==========================================
    # 5. Jenkins (CI/CD)
    # ==========================================
  jenkins:
    image: jenkins/jenkins:lts
    container_name: echoforest-jenkins
    user: root
    privileged: true
    environment:
      # Nginx 뒤에서 /jenkins 경로로 접속하기 위한 필수 설정
      - JENKINS_OPTS="--prefix=/jenkins"
      - JENKINS_ARGS="--prefix=/jenkins"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - ./jenkins_home:/var/jenkins_home # 데이터 영구 저장 (현재 폴더에 저장)
    networks:
      - echo-net

networks:
  echo-net:
    driver: bridge