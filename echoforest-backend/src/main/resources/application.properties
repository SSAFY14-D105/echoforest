# ==========================================
# 1. ?? ?? ??
# ==========================================
server.port=9001
spring.application.name=echoforest
# ==========================================
# 2. Database ?? (H2 vs MySQL ?? ??)
# ==========================================
# [??]
# - DB_URL ????? ???(Docker ?) ? ?? ?? (MySQL)
# - ???(?? ??) ???? jdbc:h2:mem:testdb ?? (H2 In-Memory)
# ????: ?? ??(MySQL)? ??? H2 ???? ??
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# H2 ?? ??? (?? ????: http://localhost:9001/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
# JPA ??
# H2? ?? MySQL? ? ??(Dialect) ?? ??
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ==========================================
# 3. Redis ??
# ==========================================
# ??: redis / ??: localhost
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# ==========================================
# 4. LiveKit ??
# ==========================================
# ??: ws://livekit:7880 / ??: ws://localhost:7880 (?? ?? IP)
livekit.url=${LIVEKIT_URL:ws://localhost:7880}
livekit.api-key=${LIVEKIT_API_KEY:devkey}
livekit.api-secret=${LIVEKIT_API_SECRET:secret}
# ==========================================
# 5. ?? ??
# ==========================================
logging.level.root=INFO
logging.level.com.d105=DEBUG
# ==========================================
# 6. [?? ???] Java 21 ?? ??? ???
# ==========================================
spring.threads.virtual.enabled=true
server.forward-headers-strategy=native