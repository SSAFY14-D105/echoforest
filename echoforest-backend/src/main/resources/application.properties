# ==========================================
# 1. ?? ?? ??
# ==========================================
server.port=9001
spring.application.name=echoforest
# ==========================================
# 2. Database ?? (H2 vs MySQL ?? ??)
# ==========================================
# [??]
# - DB_URL ????? ???(Docker ?) ? ?? ?? (MySQL)
# - ???(?? ??) ???? jdbc:h2:mem:testdb ?? (H2 In-Memory)
# ????: ?? ??(MySQL)? ??? H2 ???? ??
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/echoforest?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# JPA ??
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ==========================================
# 3. Redis ??
# ==========================================
# ??: redis / ??: localhost
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# ==========================================
# 4. LiveKit ??
# ==========================================
# ??: ws://livekit:7880 / ??: ws://localhost:7880 (?? ?? IP)
livekit.url=${LIVEKIT_URL:ws://localhost:7880}
livekit.api-key=${LIVEKIT_API_KEY:devkey}
livekit.api-secret=${LIVEKIT_API_SECRET:secret}
# ==========================================
# 5. ?? ??
# ==========================================
logging.level.root=INFO
logging.level.com.d105=DEBUG
# ==========================================
# 6. [?? ???] Java 21 ?? ??? ???
# ==========================================
spring.threads.virtual.enabled=true
server.forward-headers-strategy=native
# ==========================================
# 7. JWT Configuration (Jenkins ENV)
# ==========================================
jwt.secret-key=${JWT_SECRET_KEY}
jwt.access-token-validity=${JWT_ACCESS_TOKEN_VALIDITY:86400000}
# ==========================================
# 8. AI Model Configuration
# ==========================================
ai.model.url=${AI_MODEL_URL}
ai.model.api-key=${AI_MODEL_API_KEY}
# RestTemplate ???? ?? (AI ??? ?? ? ???? ????)
spring.cloud.http.client.connect-timeout=5000
spring.cloud.http.client.read-timeout=30000
# ==========================================
# 9. Internal Sentiment AI Server (?? ?? ???)
# ==========================================
# ?? ?? ?: SENTIMENT_AI_URL ???? ?(http://ai-server:8000) ??
# ?? ??? ?: ??? http://localhost:8000 ??
ai.sentiment.url=${SENTIMENT_AI_URL:http://localhost:8000}
# ==========================================
# 10. Email Settings (SMTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000