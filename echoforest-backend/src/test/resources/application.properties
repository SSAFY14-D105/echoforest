# 테스트용 application.properties

# AI 설정
ai.model.url=https://test.example.com/api
ai.model.api-key=test-api-key
ai.sentiment.url=http://localhost:8000

# H2 In-Memory DB
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT 설정
jwt.secret-key=test-jwt-secret-key-for-testing-purposes-only
jwt.access-token-validity=86400000

# Redis 설정 (테스트용 - embedded 또는 mock 사용)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# LiveKit 설정 (테스트용)
livekit.url=ws://localhost:7880
livekit.api-key=testkey
livekit.api-secret=testsecret

# Mail 설정 (테스트용)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# 테스트 환경 빈 오버라이드 허용
spring.main.allow-bean-definition-overriding=true