<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Speech API Test (v2)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <h1>Web Speech API (v2)</h1>
        <p class="description">
            Google Chrome Built-in Speech API.<br>
            Fast & Accurate, but Cloud-dependent & Blackbox.
        </p>

        <div class="keywords">
            <h3>테스트 키워드 (팝업 효과)</h3>
            <ul>
                <li class="buff">💖 뽀뽀 / 👍 최고야 (힐링/방어)</li>
                <li class="buff">❤️ 사랑 / 🚀 점프 (더블 점프)</li>
                <li class="debuff">😈 바보 / 멍청이 (페널티)</li>
            </ul>
        </div>
        <div id="status">Ready (Chrome Built-in)</div>
        <button id="btnRec">🎙️ Start Recording</button>
        <div id="output"></div>
    </div>
    <script src="speech_api.js?v=2"></script>
</body>

</html>
