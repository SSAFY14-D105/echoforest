<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 LOVE 제스처 + 뽀뽀 테스트</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #ff6b9d;
            margin-bottom: 15px;
        }

        .video-wrapper {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.3);
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .pose-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 15px 35px;
            border-radius: 16px;
            animation: pulse 0.5s ease-in-out infinite alternate;
            font-weight: bold;
        }

        .pose-overlay.show {
            display: flex;
        }

        .pose-overlay.fist {
            background: rgba(255, 87, 51, 0.9);
        }

        .pose-overlay.ok {
            background: rgba(46, 204, 113, 0.9);
        }

        .pose-overlay.L {
            background: rgba(231, 76, 60, 0.9);
        }

        .pose-overlay.O {
            background: rgba(46, 204, 113, 0.9);
        }

        .pose-overlay.V {
            background: rgba(52, 152, 219, 0.9);
        }

        .pose-overlay.E {
            background: rgba(155, 89, 182, 0.9);
        }

        .pose-overlay.kiss {
            background: rgba(255, 105, 180, 0.9);
        }

        @keyframes pulse {
            from {
                transform: translate(-50%, -50%) scale(1);
            }

            to {
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        .pose-icon {
            font-size: 3rem;
        }

        .pose-label {
            font-size: 1.2rem;
        }

        /* LOVE 진행 표시 */
        .love-progress {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
        }

        .love-letter {
            font-size: 1.5rem;
            opacity: 0.3;
            transition: all 0.3s;
        }

        .love-letter.done {
            opacity: 1;
            color: #ff6b9d;
            text-shadow: 0 0 10px #ff6b9d;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 8px 16px;
            font-size: 0.85rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: #fff;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .guide {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gesture-card {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            width: 80px;
        }

        .gesture-card .icon {
            font-size: 1.8rem;
            margin-bottom: 3px;
        }

        .gesture-card h4 {
            font-size: 0.75rem;
            margin-bottom: 2px;
        }

        .gesture-card p {
            font-size: 0.65rem;
            color: #888;
        }

        .status {
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.8rem;
        }

        .log {
            margin-top: 10px;
            background: #000;
            padding: 8px;
            border-radius: 8px;
            max-height: 80px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 10px;
            width: 640px;
        }

        .log p {
            margin: 1px 0;
            color: #0f0;
        }
    </style>
</head>

<body>
    <h1>💕 제스처 인식 테스트</h1>
    <p class="subtitle">✊주먹 | 👌OK | L O V E | 💋뽀뽀</p>

    <div class="video-wrapper">
        <video id="video" autoplay playsinline muted></video>

        <div class="love-progress">
            <span class="love-letter" id="letterL">L</span>
            <span class="love-letter" id="letterO">O</span>
            <span class="love-letter" id="letterV">V</span>
            <span class="love-letter" id="letterE">E</span>
            <span class="love-letter" id="letterKiss">💋</span>
        </div>

        <div class="pose-overlay" id="poseOverlay">
            <span class="pose-icon" id="poseIcon">✊</span>
            <span class="pose-label" id="poseLabel">주먹</span>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="btnInit">1️⃣ 초기화</button>
        <button class="btn" id="btnCamera" disabled>2️⃣ 카메라</button>
        <button class="btn" id="btnDetect" disabled>3️⃣ 시작</button>
        <button class="btn" id="btnReset">🔄 리셋</button>
    </div>

    <div class="guide">
        <div class="gesture-card">
            <div class="icon">✊</div>
            <h4>주먹</h4>
            <p>손가락 접기</p>
        </div>
        <div class="gesture-card">
            <div class="icon">👌</div>
            <h4>OK</h4>
            <p>엄지+검지 붙임</p>
        </div>
        <div class="gesture-card">
            <div class="icon" style="color:#e74c3c">L</div>
            <h4>L</h4>
            <p>ㄱ 직각</p>
        </div>
        <div class="gesture-card">
            <div class="icon" style="color:#3498db">V</div>
            <h4>V</h4>
            <p>검지+중지만</p>
        </div>
        <div class="gesture-card">
            <div class="icon" style="color:#9b59b6">E</div>
            <h4>E</h4>
            <p>3손가락</p>
        </div>
        <div class="gesture-card">
            <div class="icon">💋</div>
            <h4>뽀뽀</h4>
            <p>입술 오므리기</p>
        </div>
    </div>

    <div class="status">
        📊 <span id="statusText">대기</span> |
        🎯 <span id="currentGesture">-</span> |
        👁️ 얼굴: <span id="faceStatus">-</span> |
        ⏱️ <span id="fps">-</span> FPS
    </div>

    <div class="log" id="log"></div>

    <script type="module">
        import { FilesetResolver, HandLandmarker, FaceLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest';

        const video = document.getElementById('video');
        const poseOverlay = document.getElementById('poseOverlay');
        const poseIcon = document.getElementById('poseIcon');
        const poseLabel = document.getElementById('poseLabel');
        const statusText = document.getElementById('statusText');
        const currentGestureEl = document.getElementById('currentGesture');
        const faceStatusEl = document.getElementById('faceStatus');
        const fpsEl = document.getElementById('fps');
        const logEl = document.getElementById('log');

        let handLandmarker = null;
        let faceLandmarker = null;
        let isRunning = false;
        let frameCount = 0;
        let lastTime = performance.now();
        let lastGestureTime = 0;  // 디바운스용

        const loveState = { L: false, O: false, V: false, E: false, kiss: false };

        function log(msg) {
            const p = document.createElement('p');
            p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.insertBefore(p, logEl.firstChild);
            if (logEl.children.length > 10) logEl.lastChild.remove();
        }

        function updateLoveProgress() {
            document.getElementById('letterL').classList.toggle('done', loveState.L);
            document.getElementById('letterO').classList.toggle('done', loveState.O);
            document.getElementById('letterV').classList.toggle('done', loveState.V);
            document.getElementById('letterE').classList.toggle('done', loveState.E);
            document.getElementById('letterKiss').classList.toggle('done', loveState.kiss);

            if (loveState.L && loveState.O && loveState.V && loveState.E && loveState.kiss) {
                log('🎉 LOVE 완성! 🎉');
            }
        }

        // ========== 유틸리티 ==========
        function distance(p1, p2) {
            return Math.sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2 + ((p1.z || 0) - (p2.z || 0)) ** 2);
        }

        function isFingerClosed(landmarks, tipIdx, mcpIdx) {
            const wrist = landmarks[0];
            return distance(landmarks[tipIdx], wrist) < distance(landmarks[mcpIdx], wrist) * 1.1;
        }

        function isFingerExtended(landmarks, tipIdx, pipIdx) {
            const wrist = landmarks[0];
            return distance(landmarks[tipIdx], wrist) > distance(landmarks[pipIdx], wrist) * 1.05;
        }

        // ========== 손 제스처 ==========

        // ✊ 주먹: 모든 손가락 접힘
        function detectFist(landmarks) {
            const closed = [
                isFingerClosed(landmarks, 4, 2),
                isFingerClosed(landmarks, 8, 5),
                isFingerClosed(landmarks, 12, 9),
                isFingerClosed(landmarks, 16, 13),
                isFingerClosed(landmarks, 20, 17),
            ];
            const count = closed.filter(Boolean).length;
            if (count >= 5) return 0.95;
            if (count >= 4) return 0.8;
            return 0;
        }

        // 👌 OK: 엄지+검지 끝 붙임
        function detectOK(landmarks) {
            const palmSize = distance(landmarks[0], landmarks[9]);
            const tipDist = distance(landmarks[4], landmarks[8]) / palmSize;
            if (tipDist < 0.18) return 0.95;
            if (tipDist < 0.28) return 0.75;
            return 0;
        }

        // L: 엄지+검지만 펴고 직각
        function detectL(landmarks) {
            const thumbExt = isFingerExtended(landmarks, 4, 3);
            const indexExt = isFingerExtended(landmarks, 8, 7);
            const middleClosed = isFingerClosed(landmarks, 12, 9);
            const ringClosed = isFingerClosed(landmarks, 16, 13);
            const pinkyClosed = isFingerClosed(landmarks, 20, 17);

            if (thumbExt && indexExt && middleClosed && ringClosed && pinkyClosed) {
                return 0.85;
            }
            return 0;
        }

        // V: 검지+중지만 펴고, 엄지는 반드시 접힘!
        function detectV(landmarks) {
            const thumbClosed = isFingerClosed(landmarks, 4, 2);  // 엄지 접힘 필수!
            const indexExt = isFingerExtended(landmarks, 8, 7);
            const middleExt = isFingerExtended(landmarks, 12, 11);
            const ringClosed = isFingerClosed(landmarks, 16, 13);
            const pinkyClosed = isFingerClosed(landmarks, 20, 17);

            // 엄지가 접혀있어야만 V
            if (thumbClosed && indexExt && middleExt && ringClosed && pinkyClosed) {
                return 0.9;
            }
            // 엄지가 애매해도 다른 조건 만족하면 약한 V
            if (indexExt && middleExt && ringClosed && pinkyClosed) {
                return 0.6;
            }
            return 0;
        }

        // E: 엄지+검지+중지 펴고 나머지 접힘
        function detectE(landmarks) {
            const thumbExt = isFingerExtended(landmarks, 4, 3);
            const indexExt = isFingerExtended(landmarks, 8, 7);
            const middleExt = isFingerExtended(landmarks, 12, 11);
            const ringClosed = isFingerClosed(landmarks, 16, 13);
            const pinkyClosed = isFingerClosed(landmarks, 20, 17);

            // 엄지가 펴져있어야 E (V와 구분)
            if (thumbExt && indexExt && middleExt && ringClosed && pinkyClosed) {
                return 0.9;
            }
            return 0;
        }

        // ========== 얼굴 제스처 ==========

        // 💋 뽀뽀: 입술 오므림 (얼굴이 감지된 경우에만!)
        function detectKiss(faceLandmarks) {
            if (!faceLandmarks || faceLandmarks.length === 0) return { score: 0, detected: false };

            const face = faceLandmarks[0];
            if (!face || face.length < 300) return { score: 0, detected: false };

            // 입술 랜드마크
            const upperLip = face[13];
            const lowerLip = face[14];
            const leftLip = face[61];
            const rightLip = face[291];

            if (!upperLip || !lowerLip || !leftLip || !rightLip) {
                return { score: 0, detected: true };
            }

            const verticalDist = distance(upperLip, lowerLip);
            const horizontalDist = distance(leftLip, rightLip);
            const ratio = verticalDist / horizontalDist;

            // 뽀뽀: 세로가 매우 좁고, 가로도 약간 줄어듦
            // 임계값 높임 (더 확실한 뽀뽀만)
            if (ratio < 0.12 && horizontalDist < 0.15) return { score: 0.95, detected: true };
            if (ratio < 0.15 && horizontalDist < 0.18) return { score: 0.75, detected: true };

            return { score: 0, detected: true };
        }

        // ========== 메인 감지 ==========
        function detectGesture(handLandmarks, faceLandmarks) {
            let result = null;

            if (handLandmarks && handLandmarks.length > 0) {
                const hand = handLandmarks[0];

                // 우선순위: 주먹 > OK > V > E > L
                const fistScore = detectFist(hand);
                if (fistScore >= 0.75) {
                    result = { type: 'fist', score: fistScore, icon: '✊', label: '주먹!' };
                }

                if (!result) {
                    const okScore = detectOK(hand);
                    if (okScore >= 0.7) {
                        result = { type: 'ok', score: okScore, icon: '👌', label: 'OK!' };
                    }
                }

                if (!result) {
                    // V 먼저 체크 (엄지 접힘 필수)
                    const vScore = detectV(hand);
                    if (vScore >= 0.75) {
                        result = { type: 'V', score: vScore, icon: '✌️', label: 'V!' };
                    }
                }

                if (!result) {
                    const eScore = detectE(hand);
                    if (eScore >= 0.75) {
                        result = { type: 'E', score: eScore, icon: '🤟', label: 'E!' };
                    }
                }

                if (!result) {
                    const lScore = detectL(hand);
                    if (lScore >= 0.75) {
                        result = { type: 'L', score: lScore, icon: '👆', label: 'L!' };
                    }
                }
            }

            // 얼굴 감지
            const kissResult = detectKiss(faceLandmarks);
            faceStatusEl.textContent = kissResult.detected ? '✅' : '❌';

            // 뽀뽀는 얼굴이 감지된 경우에만
            if (kissResult.detected && kissResult.score >= 0.7) {
                result = { type: 'kiss', score: kissResult.score, icon: '💋', label: '뽀뽀!' };
            }

            return result;
        }

        // ========== 이벤트 ==========
        document.getElementById('btnInit').addEventListener('click', async () => {
            log('모델 초기화 중...');
            statusText.textContent = '초기화 중...';

            try {
                const vision = await FilesetResolver.forVisionTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm'
                );

                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                        delegate: 'GPU'
                    },
                    runningMode: 'VIDEO',
                    numHands: 2
                });
                log('✅ Hand OK');

                faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
                        delegate: 'GPU'
                    },
                    runningMode: 'VIDEO',
                    numFaces: 1
                });
                log('✅ Face OK');

                document.getElementById('btnInit').disabled = true;
                document.getElementById('btnInit').textContent = '✅';
                document.getElementById('btnCamera').disabled = false;
                statusText.textContent = '준비됨';
            } catch (e) {
                log('❌ 실패: ' + e.message);
            }
        });

        document.getElementById('btnCamera').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });
                video.srcObject = stream;
                await video.play();
                log('✅ 카메라 ON');
                document.getElementById('btnCamera').disabled = true;
                document.getElementById('btnCamera').textContent = '✅';
                document.getElementById('btnDetect').disabled = false;
            } catch (e) {
                log('❌ 카메라 실패');
            }
        });

        document.getElementById('btnDetect').addEventListener('click', () => {
            isRunning = true;
            document.getElementById('btnDetect').disabled = true;
            document.getElementById('btnDetect').textContent = '🔴';
            statusText.textContent = '감지 중';
            log('🎯 시작! L→O→V→E→💋');
            detectFrame();
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            loveState.L = loveState.O = loveState.V = loveState.E = loveState.kiss = false;
            updateLoveProgress();
            log('🔄 리셋');
        });

        function detectFrame() {
            if (!isRunning) return;

            const now = performance.now();

            const handResults = handLandmarker?.detectForVideo(video, now);
            const faceResults = faceLandmarker?.detectForVideo(video, now);

            frameCount++;
            if (now - lastTime >= 1000) {
                fpsEl.textContent = frameCount;
                frameCount = 0;
                lastTime = now;
            }

            const gesture = detectGesture(handResults?.landmarks, faceResults?.faceLandmarks);

            if (gesture && (now - lastGestureTime > 300)) {  // 300ms 디바운스
                poseOverlay.className = `pose-overlay show ${gesture.type}`;
                poseIcon.textContent = gesture.icon;
                poseLabel.textContent = gesture.label;
                currentGestureEl.textContent = `${gesture.type} (${(gesture.score * 100).toFixed(0)}%)`;

                if (['L', 'O', 'V', 'E', 'kiss'].includes(gesture.type) && !loveState[gesture.type]) {
                    loveState[gesture.type] = true;
                    log(`✅ ${gesture.type} 완료!`);
                    updateLoveProgress();
                    lastGestureTime = now;
                }
            } else if (!gesture) {
                poseOverlay.classList.remove('show');
                currentGestureEl.textContent = '-';
            }

            requestAnimationFrame(detectFrame);
        }
    </script>
</body>

</html>
